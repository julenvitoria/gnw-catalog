<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G&amp;W Catalog</title>
  <meta name="description" content="Catalog of cores and homebrews for the Game &amp; Watch (Retro-Go SD), with links to their latest releases.">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img class="brand__logo" src="img/logo.svg" width="84" height="47" alt="">
      <div>
        <h1 data-i18n="title">G&amp;W Catalog</h1>
        <p class="brand__tag" data-i18n="tagline"></p>
      </div>
    </div>
    <label class="lang">
      <span class="sr" data-i18n="lang"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-2.9a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.1 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.9 1.9-4ZM4.3 14a8.2 8.2 0 0 1 0-4h3.3a16 16 0 0 0 0 4H4.3Zm.8 2h2.9c.3 1.3.8 2.5 1.4 3.6A8 8 0 0 1 5.1 16ZM8 8H5.1a8 8 0 0 1 4.3-3.6C8.8 5.5 8.3 6.7 8 8Zm4 12c-.8-1.1-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.9-1.9 4Zm2.3-6H9.7a14 14 0 0 1 0-4h4.6a14 14 0 0 1 0 4Zm.3 5.6c.6-1.1 1.1-2.3 1.4-3.6h2.9a8 8 0 0 1-4.3 3.6Zm1.8-5.6a16 16 0 0 0 0-4h3.3a8.2 8.2 0 0 1 0 4h-3.3Z"/></svg>
      <select id="lang"></select>
    </label>
  </header>

  <main class="main">
    <section class="fw" id="fw" hidden>
      <div class="fw__text">
        <h2><span data-i18n="fw_title"></span> <span id="fw-name"></span></h2>
        <p id="fw-desc"></p>
        <p class="fw__note" id="fw-note" data-i18n="fw_note" hidden></p>
      </div>
      <div class="fw__dl">
        <a class="fwbtn" id="fw-rel" target="_blank" rel="noopener" hidden>
          <small data-i18n="fw_official"></small><strong></strong><em></em>
        </a>
        <a class="fwbtn fwbtn--rc" id="fw-pre" target="_blank" rel="noopener" hidden>
          <small data-i18n="fw_rc"></small><strong></strong><em></em>
        </a>
        <p class="muted small fw__hint" data-i18n="fw_assets"></p>
      </div>
    </section>

    <div class="bar">
      <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search_ph">
      <div class="chips" role="radiogroup">
        <button type="button" role="radio" data-kind="all"><span data-i18n="all"></span> <b></b></button>
        <button type="button" role="radio" data-kind="official"><span data-i18n="officials"></span> <b></b></button>
        <button type="button" role="radio" data-kind="core"><span data-i18n="cores"></span> <b></b></button>
        <button type="button" role="radio" data-kind="homebrew"><span data-i18n="homebrews"></span> <b></b></button>
        <button type="button" role="radio" data-kind="tool"><span data-i18n="tools"></span> <b></b></button>
      </div>
    </div>
    <p class="muted small" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" data-i18n="empty" hidden></p>
  </main>

  <footer class="footer">
    <span data-i18n="missing"></span>
    <a href="https://github.com/julenvitoria/gnw-catalog/issues/new?template=new-project.yml" data-i18n="propose"></a> ·
    <span data-i18n="updated"></span> ·
    <a href="https://github.com/julenvitoria/gnw-catalog">gnw-catalog</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
