# Every 8 hours: note the latest release of every project in catalog.json
# (version, date, download link) in versions.json, so the page shows them
# without asking GitHub on every visit. Commits only when something changed.
# Also runs when catalog.json changes, and by hand (Actions -> Versions ->
# Run workflow).
name: Versions

on:
  schedule:
    - cron: "41 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["catalog.json", "tools/update_versions.py", ".github/workflows/versions.yml"]

permissions:
  contents: write

concurrency:
  group: versions
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/update_versions.py
      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Versions: $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
